server {
  root /var/www/xikey.io.vn/html;
  index index.html index.htm index.nginx-debian.html;

  server_name xikey.io.vn www.xikey.io.vn;

  location / {
    try_files $uri $uri/ /index.html;
		client_max_body_size 500M;
  }

  listen [::]:443 ssl ipv6only=on; # managed by Certbot
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/xikey.io.vn/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/xikey.io.vn/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
  if ($host = xikey.io.vn) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen 80;
  listen [::]:80;

  server_name xikey.io.vn www.xikey.io.vn;
  return 404; # managed by Certbot
}
